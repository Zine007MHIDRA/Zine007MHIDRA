<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="100%">
  <defs>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0a1222"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text {
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .mono {
        font-family: "Cascadia Code", "Cascadia Mono", "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="878" height="138" rx="10" fill="url(#connBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Centered Spotlight Glowing Button matching GitSkins video -->
  <g transform="translate(325, 42)">
    <!-- Outer Glow & Pill -->
    <rect x="0" y="0" width="230" height="56" rx="28" fill="#061324" stroke="#00e5ff" stroke-width="1.5" filter="url(#cyanGlow)"/>
    <rect x="0" y="0" width="230" height="56" rx="28" fill="#07172e" stroke="#00e5ff" stroke-width="1.2"/>

    <!-- Left Icon Circle -->
    <circle cx="32" cy="28" r="16" fill="#0b2447" stroke="#173e6e" stroke-width="1"/>
    <text x="32" y="33" class="mono" font-size="14" fill="#00e5ff" font-weight="bold" text-anchor="middle">G</text>

    <!-- Text Block -->
    <text x="60" y="24" class="mono" font-size="11" font-weight="bold" fill="#38bdf8" letter-spacing="0.5">GitHub</text>
    <text x="60" y="42" class="sans" font-size="14" font-weight="600" fill="#f8fafc">@Zine007MHIDRA</text>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 865 125 L 865 132 L 857 132" stroke="#00e5ff" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 15 125 L 15 132 L 23 132" stroke="#00e5ff" stroke-width="1.2" fill="none" opacity="0.6"/>
</svg>
