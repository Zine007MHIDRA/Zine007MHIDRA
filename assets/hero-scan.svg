  <text x="36" y="86" class="mono" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1.5">VISUAL.MAP</text>
  <line x1="36" y1="94" x2="324" y2="94" stroke="#0e233d" stroke-width="1"/>

