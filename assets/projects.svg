  <path d="M 865 378 L 865 385 L 857 385" stroke="#00e5ff" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 15 378 L 15 385 L 23 385" stroke="#00e5ff" stroke-width="1.2" fill="none" opacity="0.6"/>
