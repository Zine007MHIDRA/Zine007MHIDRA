  <g transform="translate(455, 224)">
    <rect x="0" y="0" width="405" height="152" class="pcard"/>
    <line x1="8" y1="1" x2="397" y2="1" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1"/>

    <circle cx="18" cy="20" r="3.5" fill="#a855f7"/>
